# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b8d3a9ffb56d23657e4eb90cc5ff83d9"
application_url = "https://quotecrate-production.up.railway.app"
embedded = true
name = "quotecrate"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_draft_orders is required by the draftOrderCreate mutation used to turn a
# QUOTED quote into a payable draft order. It is the only scope this app asks
# for: the two other Admin calls read `shop { currencyCode }` and `shop { email }`,
# which the docs list no scope requirement for.
scopes = "write_draft_orders"

[app_proxy]
# The CLI swaps only the host of this URL when running `app dev`, so the
# "/apps/quotecrate" path is preserved and the storefront path maps 1:1 onto
# the app route at app/routes/apps.quotecrate.quote-request.tsx.
url = "https://quotecrate-production.up.railway.app/apps/quotecrate"
prefix = "apps"
subpath = "quotecrate"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # The three mandatory privacy webhooks every public app has to answer before
  # it can be submitted. They use `compliance_topics`, not `topics` — Shopify
  # treats them as a separate class and rejects them under the ordinary key.
  # https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance

  # Handled by: app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  # Handled by: app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  # Handled by: app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
# The OAuth callback this app actually serves.
#
# shopifyApp() derives it as `${authPathPrefix}/callback`, and
# app/shopify.server.ts sets authPathPrefix to "/auth", so the only path
# Shopify may redirect back to is /auth/callback — served by the splat route
# app/routes/auth.$.tsx. The "/api/auth" that stood here came from the
# template placeholder and matches no route in this app, so every OAuth
# round trip (a fresh install, or a re-auth after the offline token
# expires) was refused by Shopify as an unwhitelisted redirect_uri.
redirect_urls = [ "https://quotecrate-production.up.railway.app/auth/callback" ]

[build]
# Left off deliberately.
#
# With this on, `shopify app dev` rewrites application_url, the app proxy
# url and redirect_urls to its temporary tunnel and pushes them to the
# dashboard — which is how the live URLs came to point somewhere the
# deployed app never was, leaving the admin iframe loading a dead host.
# With it off, `app dev` prints the tunnel URL and leaves the released
# configuration alone; update it deliberately with `shopify app deploy`.
automatically_update_urls_on_dev = false
