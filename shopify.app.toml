# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b8d3a9ffb56d23657e4eb90cc5ff83d9"
application_url = "https://quotecrate-production.up.railway.app"
embedded = true
name = "quotecrate"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_draft_orders is required by the draftOrderCreate mutation used to turn a
# QUOTED quote into a payable draft order. It is the only scope this app asks
# for: the two other Admin calls read `shop { currencyCode }` and `shop { email }`,
# which the docs list no scope requirement for.
scopes = "write_draft_orders"

[app_proxy]
# The CLI swaps only the host of this URL when running `app dev`, so the
# "/apps/quotecrate" path is preserved and the storefront path maps 1:1 onto
# the app route at app/routes/apps.quotecrate.quote-request.tsx.
url = "https://quotecrate-production.up.railway.app/apps/quotecrate"
prefix = "apps"
subpath = "quotecrate"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
# The OAuth callback this app actually serves.
#
# shopifyApp() derives it as `${authPathPrefix}/callback`, and
# app/shopify.server.ts sets authPathPrefix to "/auth", so the only path
# Shopify may redirect back to is /auth/callback — served by the splat route
# app/routes/auth.$.tsx. The "/api/auth" that stood here came from the
# template placeholder and matches no route in this app, so every OAuth
# round trip (a fresh install, or a re-auth after the offline token
# expires) was refused by Shopify as an unwhitelisted redirect_uri.
redirect_urls = [ "https://quotecrate-production.up.railway.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
